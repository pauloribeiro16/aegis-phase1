# Data Subjects (Case 02 — SecureBorder Solutions)
data_subjects:
  # Border-crossing biometric subjects: facial templates are biometric data used for
  # unique identification => GDPR Art. 9 special category (lawful under Art. 9(2)(g)).
  # `special_category` is read by scripts/kg_eval/engine.py to emit
  # (:DataSubject)-[:TRIGGERS_CLAUSE]->(:RegulatoryClause {article_reference: 'Art. 9...'}).
  - id: SUBJ-01
    category: "Schengen Travellers"
    data_types: ["Passport MRZ", "Facial Biometric Template", "Match Decision Audit Metadata"]
    special_category: true
    legal_basis: "Art. 9(2)(g) GDPR (Substantial public interest / government mandate)"
    erasure_mechanism: "Automatic purge from edge cache within seconds post-match"
  - id: SUBJ-02
    category: "EU Employees"
    data_types: ["Employment records", "Performance", "Salaries", "Benefits", "Training records"]
    legal_basis: "Art. 6(1)(b) GDPR (Contract performance)"
    erasure_mechanism: "HR-driven per NL statutory 7-year retention schedule"
  - id: SUBJ-03
    category: "Job Applicants"
    data_types: ["CV", "Interview notes", "References"]
    legal_basis: "Art. 6(1)(a)/(b) GDPR"
    erasure_mechanism: "Auto-purge 4 weeks after process closure"
  - id: SUBJ-04
    category: "External Contractors & Vendors"
    data_types: ["Contract details", "Building & system access logs", "Payment metadata"]
    legal_basis: "Art. 6(1)(b)/(c) GDPR"
    erasure_mechanism: "Per contract terms + 7-year tax retention"
