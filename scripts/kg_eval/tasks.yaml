# KG-eval T1 task catalogue (CORR-113 Commit 3).
#
# One representative task per (case × family) = 15 tasks. Each task is run
# twice (with-KG / no-KG) per `docs/KG_EVAL_PROTOCOL.md` §3.
#
# Field semantics:
#   id:           Stable task ID; format <FAMILY>-<CASE>-<SUBDOMAIN>.
#   family:       T1.1..T1.5 (mirrors the 5 families in §2 of the protocol).
#   case:         Case directory name (relative to cases/).
#   subdomain_id: Canonical subdomain ID (D-XX.Y).
#   asset_id:     For T1.1 + T1.5 only: the case asset the task targets.
#                 Must be present in cases/<case>/input/architecture/ YAMLs.
#   question:     The task question rendered verbatim into the prompt.
#   expected_structure: Markdown shape the scorer checks for (T1.1..T1.5 §2.x).
#   scoring_criteria:    Per-metric hint list (full rubric in protocol §4).

tasks:

  # ─── T1.1 — Grounding fidelity ─────────────────────────────────────
  - id: T1.1-case1-D-01.1
    family: T1.1
    case: case1-tinytask
    subdomain_id: D-01.1
    asset_id: SYS-01
    question: >-
      For case1-tinytask system SYS-01 (Main SaaS Application), list every
      regulatory obligation that binds it, cite the source article(s), and
      the NIST CSF 2.0 subcategories that anchor them.
    expected_structure: |
      ## Affected systems
      ## Legal clauses (per regulation)
      ## CSF anchors
      ## In-scope rule
    scoring_criteria:
      - "citation ⊆ packet"
      - "zero invented article references"
      - "CSF tokens ∈ catalogue"
      - "≥1 legal clause cited"
      - "≥1 CSF anchor cited"

