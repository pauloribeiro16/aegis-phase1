      (24h for actively exploited vulnerabilities). Cite the resolution
      principle the methodology records and state the severity.
    expected_structure: |
      ### Tension Resolution: REG_A vs REG_B — TYPE
      - Friction:
      - Resolution adopted:
      - Severity:
      - Source reference:
    scoring_criteria:
      - "structured-block present"
      - "resolution cited"
      - "severity ∈ {HIGH, MEDIUM, LOW}"
      - "both regulations cited"

