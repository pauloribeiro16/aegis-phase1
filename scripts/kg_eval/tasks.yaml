  # ─── T1.6 — Obligation derivation (deterministic ground truth) ─────
  #
  # For a (case, subdomain) pair, derive the set of ACTIVATED obligations.
  # Ground truth is precomputed by scripts/kg_eval/ground_truth.py (mirrors
  # what the KG ETL would emit as (:ClauseActivation) per KG-10). Scoring is
  # exact-match: every required clause_id must appear in the model output;
  # any invented clause_id is a fail. Tier is fixed at the case's scale to
  # remove one variable.

  - id: T1.6-case1-D-01.1
    family: T1.6
    case: case1-tinytask
    subdomain_id: D-01.1
    asset_id: SYS-01
    question: >-
      For case1-tinytask, derive every regulatory obligation that is
      ACTIVATED for subdomain D-01.1 (Data Encryption) at the enterprise's
      scale. For each obligation, cite the clause ID and the source
      article. Do NOT cite obligations that do not bind this enterprise.
    expected_structure: |
      ## Activated obligations
      - <REG>-CL<N>: <Article> — <one-line gist>
    scoring_criteria:
      - "set(cited clause_ids) == ground_truth set (exact-match)"
      - "zero invented clause_ids"
      - "article references ⊆ activated clauses' articles"
      - "no GlobalRegulation/regulation-only tokens without clause_id"

