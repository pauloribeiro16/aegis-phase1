      applicable reading for this company, state the disposition (one of
      RESOLVED_BY_FACT, RESOLVED_BY_TIER, NEEDS_HUMAN), and the anchors
      (article IDs, tier, asset IDs, business goal IDs) that support the
      call. If the pair is not CONDITIONAL, say so explicitly and explain
      why no disposition is required.
    expected_structure: |
      ### Ambiguity Disposition: REG_A vs REG_B — D-XX.Y
      - Reading adopted:
      - Anchors:
      - Consequence:
      - Disposition:
    scoring_criteria:
      - "structured-block present"
      - "disposition ∈ closed vocabulary (or explicit N/A rationale)"
      - "reading ∈ verbatim_articles when CONDITIONAL"
      - "anchors ⊆ closed lists"

